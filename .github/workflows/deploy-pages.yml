name: Deploy AlloyView to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Test
        id: tests
        shell: bash
        run: |
          set -o pipefail
          node --version
          npm test -- --test-reporter=spec 2>&1 | tee "$RUNNER_TEMP/alloyview-tests.log"

      - name: Summarize tests
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure' || steps.tests.outcome == 'cancelled')
        run: node scripts/ci-test-summary.mjs "$RUNNER_TEMP/alloyview-tests.log" "${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failed test log
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: node-test-log
          path: ${{ runner.temp }}/alloyview-tests.log
          retention-days: 7

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
